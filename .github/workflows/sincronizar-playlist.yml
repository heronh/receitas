name: Sincronizar playlist do YouTube

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/coletar_playlist.py"
      - ".github/workflows/sincronizar-playlist.yml"

permissions:
  contents: write

concurrency:
  group: sincronizar-playlist
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Coletar playlist e legendas
        run: python scripts/coletar_playlist.py

      - name: Registrar atualização
        run: |
          if git diff --quiet -- data/; then
            echo "Nenhuma alteração na playlist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Atualiza dados da playlist de receitas"
          git push
