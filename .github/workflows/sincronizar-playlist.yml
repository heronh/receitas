name: Sincronizar playlist do YouTube

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/coletar_playlist.py"
      - ".github/workflows/sincronizar-playlist.yml"

permissions:
  contents: write

concurrency:
  group: sincronizar-playlist
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar yt-dlp nightly
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default] @ https://github.com/yt-dlp/yt-dlp/archive/master.tar.gz"
          yt-dlp --version

      - name: Coletar playlist e legendas
        id: coleta
        continue-on-error: true
        run: python scripts/coletar_playlist.py

      - name: Registrar resultado da coleta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- data/; then
            git add data/
            git commit -m "Atualiza dados da playlist de receitas"
            git push
          else
            echo "Nenhuma alteração em data/."
          fi

      - name: Validar inventário
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("data/coleta-relatorio.json")
          if report.exists():
              print(report.read_text(encoding="utf-8"))

          playlist = Path("data/playlist.json")
          if not playlist.exists():
              raise SystemExit("playlist.json não foi gerado")

          data = json.loads(playlist.read_text(encoding="utf-8"))
          count = len(data.get("videos") or [])
          print(f"Vídeos coletados: {count}")
          if count == 0:
              raise SystemExit("playlist.json foi gerado sem vídeos")
          PY
