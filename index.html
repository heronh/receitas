<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ec">
  <meta name="description" content="Minhas receitas favoritas com lista de compras.">
  <title>Minhas Receitas Favoritas</title>
  <link rel="icon" href="imagens/receita-icon-herbs.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topo" id="topo">
    <div class="topo__linha">
      <h1 class="topo__titulo">Minhas Receitas</h1>
      <span class="topo__contagem" id="contagem" aria-live="polite"></span>
    </div>
    <label class="busca">
      <span class="visualmente-oculto">Buscar receita ou ingrediente</span>
      <svg class="busca__icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.13l4.24 4.23-1.42 1.42-4.23-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
      <input type="search" id="busca" placeholder="Buscar receita ou ingrediente" autocomplete="off">
    </label>
    <nav class="filtros" id="filtros" aria-label="Filtrar por categoria"></nav>
  </header>

  <main>
    <section class="indice" id="indice" aria-label="Índice de receitas">
      <ul class="indice__lista" id="indice-lista"></ul>
      <p class="vazio" id="vazio" hidden>Nenhuma receita encontrada.</p>
    </section>

    <div class="receitas" id="receitas"></div>
  </main>

  <footer class="rodape">
    <p>Valores nutricionais aproximados, por porção.</p>
  </footer>

  <a href="#topo" class="voltar" id="voltar" aria-label="Voltar ao índice" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.6 4.3 13.3l1.4 1.4L11 9.4V20h2V9.4l5.3 5.3 1.4-1.4z"/></svg>
  </a>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script src="js/receitas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
